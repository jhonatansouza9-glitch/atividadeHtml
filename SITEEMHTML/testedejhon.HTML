<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Saulo Lindão</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(10px);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .fotos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .fotos img {
            width: 220px;
            height: 220px;
            object-fit: cover;

            border-radius: 20px;
            border: 4px solid white;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);

            transition: transform 0.3s;
        }

        .fotos img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Saulo peida cheiroso 💨</h1>

        <p>Sem nada a falar, só Saulo mesmo.</p>

        <div class="fotos">
            <img src="saulosub5.jfif" alt="saulo ontem">
            <img src="saulochad.jpg" alt="saulo hj que falou">
            <img src="pédosaulo.jpg" alt="pé do saulo">
        </div>

    </div>

</body>
</html>
